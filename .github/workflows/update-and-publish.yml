name: Update and Publish SDK

on:
  repository_dispatch:
    types: [update-sdk]
  workflow_dispatch:

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check whether crates.io already has the API version
        id: compare
        run: |
          NEW_VERSION=$(curl -fsS https://api.linkbreakers.com/internal/openapi/api/v1/api.swagger.json | jq -r '.info.version')
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -H 'User-Agent: linkbreakers-rust release' \
            "https://crates.io/api/v1/crates/linkbreakers/$NEW_VERSION")
          case "$CODE" in
            200) echo "needs_update=false" >> $GITHUB_OUTPUT; echo "crates.io already has $NEW_VERSION" ;;
            404) echo "needs_update=true" >> $GITHUB_OUTPUT; echo "crates.io does not have $NEW_VERSION yet" ;;
            *) echo "Unexpected HTTP $CODE from crates.io" >&2; exit 1 ;;
          esac

      - name: Generate SDK
        if: steps.compare.outputs.needs_update == 'true'
        env:
          NEW_VERSION: ${{ steps.compare.outputs.new_version }}
        run: |
          npm install -g @openapitools/openapi-generator-cli
          curl -fsS https://api.linkbreakers.com/internal/openapi/api/v1/api.swagger.json \
            | jq '.openapi = "3.1.0" | del(.jsonSchemaDialect)' > openapi-3.1.json

          rm -rf src docs
          openapi-generator-cli generate \
            -i openapi-3.1.json \
            -g rust \
            -o . \
            -c openapi-config.yaml \
            -t templates \
            --skip-validate-spec \
            --git-host github.com \
            --git-user-id linkbreakers-com \
            --git-repo-id linkbreakers-rust \
            --global-property apiTests=false,modelTests=false,apiDocs=false,modelDocs=false \
            --additional-properties=packageVersion=$NEW_VERSION

          echo "$NEW_VERSION" > OPENAPI_VERSION
          rm openapi-3.1.json

      - name: Smoke check the crate and README
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          cargo build
          ./scripts/check-docs.sh
          cargo package --allow-dirty

      - name: Publish to crates.io
        if: steps.compare.outputs.needs_update == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty --no-verify

      - name: Commit, tag and push
        if: steps.compare.outputs.needs_update == 'true'
        env:
          NEW_VERSION: ${{ steps.compare.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: update SDK to API version $NEW_VERSION"
          fi
          git push origin main
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$NEW_VERSION" >/dev/null; then
            git tag "v$NEW_VERSION"
            git push origin "v$NEW_VERSION"
          fi

      - name: Close release failure issues
        if: success() && steps.compare.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.compare.outputs.new_version }}
        run: |
          for number in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label release-failure --json number --jq '.[].number'); do
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Published $NEW_VERSION."
          done

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.compare.outputs.new_version || 'unknown' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MESSAGE="Publishing linkbreakers $NEW_VERSION to crates.io failed. Run: $RUN_URL"
          echo "::error title=Release failed::$MESSAGE"
          gh label create release-failure --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "The update and publish workflow failed" --force
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label release-failure --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$MESSAGE"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label release-failure \
              --title "SDK release failing" --body "$MESSAGE"
          fi
