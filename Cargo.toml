[package]
name = "linkbreakers"
version = "1.165.0"
edition = "2021"
authors = ["Linkbreakers Team <support@linkbreakers.com>"]
description = "Official Rust SDK for the Linkbreakers API"
license = "MIT"
repository = "https://github.com/linkbreakers-com/linkbreakers-rust"
homepage = "https://linkbreakers.com"
documentation = "https://docs.rs/linkbreakers"
keywords = ["linkbreakers", "api", "sdk", "url-shortener"]
categories = ["api-bindings", "web-programming"]
readme = "README.md"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
reqwest = { version = "^0.13", default-features = false, features = ["json", "multipart", "query", "form"] }

[features]
default = ["native-tls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
